name: package
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Not `npm ci`: the lock file, written on Windows, omits the dependencies
      # of optional packages that are not installed there (wasm @emnapi/*,
      # bufferutil) — a known npm flaw — and `npm ci` demands them
      # ("Missing … from lock file"). `npm install` reads the lock and fills in.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:pack

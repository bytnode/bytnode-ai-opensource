name: paquet
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Le package-lock est ecrit par npm 11 ; le npm 10 livre avec Node 22
      # range autrement les dependances optionnelles wasm (@emnapi/*) et
      # refuse le verrou (« Missing … from lock file »). Meme npm des deux cotes.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:pack

name: paquet
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pas `npm ci` : le verrou, ecrit sous Windows, omet les dependances des
      # paquets optionnels qui n'y sont pas installes (wasm @emnapi/*,
      # bufferutil) — defaut connu de npm — et `npm ci` les reclame
      # (« Missing … from lock file »). `npm install` lit le verrou et comble.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:pack
